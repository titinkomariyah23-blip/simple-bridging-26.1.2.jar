name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract zip
        run: |
          unzip -o simple-bridging-26.1.2.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build project
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          elif [ -f "*/gradlew" ]; then
            cd $(dirname $(find . -name "gradlew" | head -n 1))
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: "**/build/libs/*.jar"
