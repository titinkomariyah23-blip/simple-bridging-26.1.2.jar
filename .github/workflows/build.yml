name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract zip and move contents
        run: |
          unzip simple-bridging-26.1.2.zip
          DIR_NAME=$(find . -maxdepth 1 -type d ! -path . ! -path './.git' ! -path './.github')
          if [ -n "$DIR_NAME" ]; then
            mv $DIR_NAME/* .
            mv $DIR_NAME/.* . 2>/dev/null || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: build/libs/*.jar
